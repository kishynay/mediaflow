<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MediaFlow — Your Personal Media Server</title>
  <meta name="description" content="Stream, browse, and manage your personal media collection — videos, audio, and images." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <!-- Drag & Drop Overlay -->
  <div id="dropZone" class="drop-zone-overlay">
    <div class="drop-zone-box">
      <div class="icon">📂</div>
      <h2>Drop to Upload</h2>
      <p>Release your file to start uploading</p>
    </div>
  </div>

  <!-- Upload Progress -->
  <div id="uploadProgress" class="upload-progress">
    <div class="upload-progress-label">Uploading…</div>
    <div class="upload-progress-bar">
      <div id="uploadFill" class="upload-progress-fill"></div>
    </div>
  </div>

  <!-- Status Toast -->
  <div id="statusToast" class="status-bar"></div>

  <!-- Auth Panel -->
  <div id="loginPanel" class="login-panel hidden">
    <div class="login-box">
      <h2>MediaFlow Login</h2>
      <p>Enter credentials to access your media library.</p>
      <label>
        Username
        <input id="loginUsername" type="text" placeholder="Username" autocomplete="username" />
      </label>
      <label>
        Password
        <input id="loginPassword" type="password" placeholder="Password" autocomplete="current-password" />
      </label>
      <div class="login-actions">
        <button id="loginBtn" class="btn btn-primary">Sign in</button>
      </div>
      <div id="loginError" class="login-error"></div>
    </div>
  </div>

  <div class="app-container">
    <!-- Header -->
    <header class="header">
      <div class="header-logo">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polygon points="23 7 16 12 23 17 23 7" />
          <rect x="1" y="5" width="15" height="14" rx="2" ry="2" />
        </svg>
        <h1>MediaFlow</h1>
      </div>

      <div class="search-wrapper">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="11" cy="11" r="8" />
          <path d="m21 21-4.3-4.3" />
        </svg>
        <input id="searchInput" type="text" class="search-input" placeholder="Search your media…" autocomplete="off" />
      </div>

      <div class="header-actions">
        <button id="uploadBtn" class="btn btn-primary" aria-label="Upload media">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" />
            <polyline points="17 8 12 3 7 8" />
            <line x1="12" y1="3" x2="12" y2="15" />
          </svg>
          Upload
        </button>
        <input id="fileInput" type="file" class="hidden" accept="video/*,audio/*,image/*" multiple />
      </div>
    </header>

    <!-- Main Content -->
    <main id="mainContent"></main>
  </div>

  <!-- ======================== CINEMATIC PLAYER OVERLAY ======================== -->
  <div id="playerOverlay" class="player-overlay">
    <div class="player-backdrop" id="playerBackdrop"></div>

    <div id="playerContainer" class="player-container">
      <!-- Close button -->
      <button id="playerCloseBtn" class="player-close-btn" aria-label="Close player">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M18 6L6 18M6 6l12 12"/></svg>
      </button>

      <!-- Media viewport -->
      <div id="playerMediaArea" class="player-media-area">
        <!-- Ambient glow behind video (canvas) -->
        <canvas id="ambientCanvas" class="ambient-canvas"></canvas>

        <video id="videoEl"></video>
        <audio id="audioEl"></audio>
        <img id="imageEl" alt="preview" />

        <!-- Audio visualizer canvas -->
        <canvas id="visualizerCanvas" class="visualizer-canvas hidden"></canvas>

        <!-- Audio info -->
        <div id="audioVisual" class="audio-visual hidden">
          <div class="audio-disc" id="audioDisk">
            <div class="audio-disc-inner">🎵</div>
          </div>
          <div id="audioTitle" class="audio-title"></div>
        </div>

        <!-- Skip feedback indicators (YouTube-style) -->
        <div id="skipBackward" class="skip-indicator skip-left">
          <div class="skip-ripple"></div>
          <svg width="28" height="28" viewBox="0 0 24 24" fill="currentColor"><path d="M12.5 3C7.81 3 4 6.81 4 11.5h-3l4 4 4-4H6c0-3.59 2.91-6.5 6.5-6.5s6.5 2.91 6.5 6.5-2.91 6.5-6.5 6.5c-1.56 0-2.98-.56-4.09-1.47l-1.42 1.42C8.73 19.17 10.5 20 12.5 20c4.69 0 8.5-3.81 8.5-8.5S17.19 3 12.5 3z"/></svg>
          <span>10s</span>
        </div>
        <div id="skipForward" class="skip-indicator skip-right">
          <div class="skip-ripple"></div>
          <svg width="28" height="28" viewBox="0 0 24 24" fill="currentColor"><path d="M11.5 3C6.81 3 3 6.81 3 11.5S6.81 20 11.5 20c1.99 0 3.77-.83 5.01-2.15l-1.42-1.42c-.91.91-2.16 1.47-3.59 1.47-3.59 0-6.5-2.91-6.5-6.5S7.91 5 11.5 5 18 7.91 18 11.5h-3l4 4 4-4h-3C20 6.81 16.19 3 11.5 3z"/></svg>
          <span>10s</span>
        </div>

        <!-- Center play/pause pulse -->
        <div id="centerAction" class="center-action">
          <div class="center-action-icon" id="centerActionIcon">
            <svg id="centerPlaySvg" width="48" height="48" viewBox="0 0 24 24" fill="currentColor"><polygon points="5 3 19 12 5 21 5 3"/></svg>
          </div>
        </div>

        <!-- Keyboard shortcut flash -->
        <div id="shortcutFlash" class="shortcut-flash"></div>

        <!-- Image zoom tools -->
        <div id="imageTools" class="image-tools hidden">
          <button id="zoomOut" class="img-tool-btn" title="Zoom out">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/><path d="M8 11h6"/></svg>
          </button>
          <button id="zoomReset" class="img-tool-btn" title="Reset zoom">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg>
          </button>
          <button id="zoomIn" class="img-tool-btn" title="Zoom in">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/><path d="M11 8v6"/><path d="M8 11h6"/></svg>
          </button>
          <div class="img-tool-divider"></div>
          <button id="imgFullscreen" class="img-tool-btn" title="Fullscreen">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="15 3 21 3 21 9"/><polyline points="9 21 3 21 3 15"/><line x1="21" y1="3" x2="14" y2="10"/><line x1="3" y1="21" x2="10" y2="14"/></svg>
          </button>
        </div>

        <!-- ============= Controls bar ============= -->
        <div id="playerControls" class="player-controls hidden">
          <!-- Now playing -->
          <div class="controls-top-row">
            <div id="nowPlaying" class="player-now-playing">Now Playing</div>
          </div>

          <!-- Seek bar -->
          <div class="seek-container" id="seekContainer">
            <div class="seek-hover-time" id="seekHoverTime">00:00</div>
            <div class="seek-track" id="seekTrack">
              <div class="seek-buffered" id="seekBuffered"></div>
              <div class="seek-fill" id="seekFill"></div>
              <div class="seek-thumb" id="seekThumb"></div>
            </div>
            <input id="seekSlider" type="range" class="seek-slider-input" min="0" max="10000" value="0" />
          </div>

          <!-- Button row -->
          <div class="controls-row">
            <div class="controls-left">
              <button id="prevBtn" class="ctrl-btn" title="Previous (Shift+P)">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/></svg>
              </button>
              <button id="back10Btn" class="ctrl-btn" title="Back 10s (J)">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M11.99 5V1l-5 5 5 5V7c3.31 0 6 2.69 6 6s-2.69 6-6 6-6-2.69-6-6h-2c0 4.42 3.58 8 8 8s8-3.58 8-8-3.58-8-8-8z"/><text x="12" y="16.5" font-size="7.5" font-weight="bold" fill="currentColor" text-anchor="middle" font-family="sans-serif">10</text></svg>
              </button>
              <!-- Play/Pause -->
              <button id="playPauseBtn" class="ctrl-btn play-btn" title="Play/Pause (Space)">
                <svg id="ppIcon" width="22" height="22" viewBox="0 0 24 24" fill="currentColor">
                  <polygon id="ppShape" points="5 3 19 12 5 21 5 3"/>
                </svg>
              </button>
              <button id="fwd10Btn" class="ctrl-btn" title="Forward 10s (L)">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M18 13c0 3.31-2.69 6-6 6s-6-2.69-6-6h-2c0 4.42 3.58 8 8 8s8-3.58 8-8-3.58-8-8-8v4l-5-5 5-5v4c3.31 0 6 2.69 6 6z"/><text x="12" y="16.5" font-size="7.5" font-weight="bold" fill="currentColor" text-anchor="middle" font-family="sans-serif">10</text></svg>
              </button>
              <button id="nextBtn" class="ctrl-btn" title="Next (Shift+N)">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/></svg>
              </button>
              <!-- Time -->
              <span id="timeDisplay" class="time-display">00:00 / 00:00</span>
            </div>

            <div class="controls-right">
              <!-- Loop -->
              <button id="loopBtn" class="ctrl-btn" title="Loop (R)">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="17 1 21 5 17 9"/><path d="M3 11V9a4 4 0 0 1 4-4h14"/><polyline points="7 23 3 19 7 15"/><path d="M21 13v2a4 4 0 0 1-4 4H3"/></svg>
              </button>
              <!-- Speed -->
              <button id="speedBtn" class="ctrl-btn speed-btn" title="Playback speed">
                <span id="speedLabel">1×</span>
              </button>
              <!-- Speed dropdown (hidden by default) -->
              <div id="speedMenu" class="speed-menu hidden">
                <button data-speed="0.25">0.25×</button>
                <button data-speed="0.5">0.5×</button>
                <button data-speed="0.75">0.75×</button>
                <button data-speed="1" class="active">1×</button>
                <button data-speed="1.25">1.25×</button>
                <button data-speed="1.5">1.5×</button>
                <button data-speed="1.75">1.75×</button>
                <button data-speed="2">2×</button>
              </div>
              <!-- Volume -->
              <div class="volume-group">
                <button id="volumeBtn" class="ctrl-btn" title="Mute (M)">
                  <svg id="volIcon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/>
                    <path id="volWave1" d="M15.54 8.46a5 5 0 0 1 0 7.07"/>
                    <path id="volWave2" d="M19.07 4.93a10 10 0 0 1 0 14.14"/>
                  </svg>
                </button>
                <input id="volumeSlider" type="range" class="volume-slider" min="0" max="1" step="0.02" value="1" />
              </div>
              <!-- PiP -->
              <button id="pipBtn" class="ctrl-btn" title="Picture in Picture (P)">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="3" width="20" height="14" rx="2"/><rect x="11" y="9" width="9" height="7" rx="1" fill="currentColor" opacity="0.3"/></svg>
              </button>
              <!-- Fullscreen -->
              <button id="fullscreenBtn" class="ctrl-btn" title="Fullscreen (F)">
                <svg id="fsIcon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <polyline points="15 3 21 3 21 9"/>
                  <polyline points="9 21 3 21 3 15"/>
                  <line x1="21" y1="3" x2="14" y2="10"/>
                  <line x1="3" y1="21" x2="10" y2="14"/>
                </svg>
              </button>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
